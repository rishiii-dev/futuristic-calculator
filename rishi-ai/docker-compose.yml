services:
  ollama:
    image: ollama/ollama:latest
    container_name: rishi-ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: rishi-ai-backend
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
    ports:
      - "8080:8080"
    depends_on:
      - ollama

volumes:
  ollama_data:
