<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rishi AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #070b14; color: #eef3ff; }
    .shell { max-width: 900px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 28px; }
    .status { font-size: 13px; opacity: .75; }
    .card { background: #0e1525; border: 1px solid #22304a; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.3); }
    #chat { height: 65vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; }
    .user { align-self: flex-end; background: #244a83; }
    .assistant { align-self: flex-start; background: #182338; }
    form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #22304a; }
    textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px; border-radius: 12px; border: 1px solid #2b3b59; background: #080d18; color: inherit; outline: none; }
    button { border: 0; border-radius: 12px; padding: 0 18px; background: #6d7cff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Rishi AI</h1>
        <div class="status" id="status">Connecting to local model…</div>
      </div>
    </header>
    <section class="card">
      <div id="chat"></div>
      <form id="form">
        <textarea id="input" placeholder="Ask Rishi AI…" rows="1"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const status = document.getElementById('status');
let messages = [];

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const data = await r.json();
    status.textContent = `${data.model} · local`;
  } catch { status.textContent = 'Local model status unavailable'; }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = '';
  messages.push({ role: 'user', content: message });
  addMessage('user', message);
  send.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    messages.push({ role: 'assistant', content: data.content });
    addMessage('assistant', data.content);
  } catch (error) {
    addMessage('assistant', `Error: ${error.message}`);
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

loadConfig();
</script>
</body>
</html>
